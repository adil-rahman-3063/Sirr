<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A beautifully designed Islamic prayer times and Qibla compass app.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="سِرّ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>سِرّ</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.currentDeviceHeading = null;
    function handleCompassEvent(e) {
      if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
        window.currentDeviceHeading = e.webkitCompassHeading;
      } else if (e.alpha !== null) {
        let h = 360 - e.alpha;
        if (h < 0) h += 360;
        if (h >= 360) h -= 360;
        window.currentDeviceHeading = h;
      }
    }

    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', handleCompassEvent, true);
    }
    window.addEventListener('deviceorientation', handleCompassEvent, true);

    window.getDeviceCompassHeading = function() {
      return window.currentDeviceHeading;
    };

    window.getDeviceIanaTimezone = function() {
      try {
        return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
      } catch (e) {
        return 'UTC';
      }
    };

    window.requestDeviceOrientation = async function() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          return permissionState === 'granted';
        } catch (error) {
          console.error("Error requesting device orientation permission:", error);
          return false;
        }
      }
      return true;
    };

    window.requestWebNotificationPermission = async function() {
      if (!('Notification' in window)) {
        return false;
      }
      try {
        const permission = await Notification.requestPermission();
        return permission === 'granted';
      } catch (e) {
        console.error("Error requesting notification permission:", e);
        return false;
      }
    };

    window.showWebNotification = async function(title, body, icon) {
      if (!('Notification' in window) || Notification.permission !== 'granted') {
        return false;
      }
      const options = {
        body: body || '',
        icon: icon || 'icons/Icon-192.png',
        badge: 'icons/Icon-192.png',
        vibrate: [200, 100, 200],
        tag: 'prayer-reminder',
        renotify: true
      };

      // Try service worker first (REQUIRED on Android Chrome / mobile browsers)
      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.ready;
          if (reg && reg.showNotification) {
            await reg.showNotification(title, options);
            return true;
          }
        } catch (swErr) {
          console.log("ServiceWorker showNotification fallback:", swErr);
        }
      }

      // Fallback to standard constructor (Desktop browsers)
      try {
        new Notification(title, options);
        return true;
      } catch (err) {
        console.error("Failed to show web notification:", err);
        return false;
      }
    };

    function getSwUrl() {
      return new URL('sw.js', document.baseURI || window.location.href).href;
    }

    // Auto-register Service Worker on page load
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register(getSwUrl(), { scope: './' })
          .then(function(reg) {
            console.log('[Sirr] Service Worker registered on load:', reg.scope);
          })
          .catch(function(err) {
            console.error('[Sirr] Service Worker registration failed on load:', err);
          });
      });
    }

    async function getActiveSWRegistration() {
      if (!('serviceWorker' in navigator)) return null;
      try {
        const swUrl = getSwUrl();
        await navigator.serviceWorker.register(swUrl, { scope: './' });
        return await navigator.serviceWorker.ready;
      } catch (err) {
        console.error('[WebPush] Error getting active SW registration:', err);
        return null;
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    window.getNotificationPermissionState = function() {
      if (!('Notification' in window)) return 'unsupported';
      return Notification.permission; // 'granted', 'denied', or 'default'
    };

    window.subscribeWebPush = async function(vapidPublicKey) {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        console.warn("[WebPush] PushManager not supported in this browser");
        return null;
      }
      try {
        let permission = Notification.permission;
        if (permission !== 'granted') {
          permission = await Notification.requestPermission();
        }
        if (permission !== 'granted') {
          console.warn("[WebPush] Notification permission not granted:", permission);
          return null;
        }

        const registration = await getActiveSWRegistration();
        if (!registration) {
          console.error("[WebPush] No active service worker registration available");
          return null;
        }

        const applicationServerKey = urlBase64ToUint8Array(vapidPublicKey);
        let subscription = await registration.pushManager.getSubscription();

        if (!subscription) {
          try {
            subscription = await registration.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: applicationServerKey
            });
          } catch (subErr) {
            // Handle stale or mismatched subscription keys
            console.warn("[WebPush] Initial subscription failed, resetting stale registration:", subErr);
            const stale = await registration.pushManager.getSubscription();
            if (stale) {
              await stale.unsubscribe().catch(() => {});
            }
            subscription = await registration.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: applicationServerKey
            });
          }
        }

        const json = subscription.toJSON();
        console.log("[WebPush] Push notifications enabled successfully.");
        return JSON.stringify(json);
      } catch (e) {
        console.error("[WebPush] Error during subscribeWebPush:", e);
        return null;
      }
    };

    window.getWebPushSubscription = async function() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return null;
      if (Notification.permission !== 'granted') return null;
      try {
        const registration = await getActiveSWRegistration();
        if (!registration) return null;
        const subscription = await registration.pushManager.getSubscription();
        if (!subscription) return null;
        return JSON.stringify(subscription.toJSON());
      } catch (e) {
        console.error("[WebPush] Error getting push subscription:", e);
        return null;
      }
    };

    window.unsubscribeWebPush = async function() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return true;
      try {
        const registration = await getActiveSWRegistration();
        if (!registration) return true;
        const subscription = await registration.pushManager.getSubscription();
        if (subscription) {
          return await subscription.unsubscribe();
        }
        return true;
      } catch (e) {
        console.error("[WebPush] Error unsubscribing:", e);
        return false;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
