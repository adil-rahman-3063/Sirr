<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A beautifully designed Islamic prayer times and Qibla compass app.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="سِرّ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>سِرّ</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.currentDeviceHeading = null;
    function handleCompassEvent(e) {
      if (e.webkitCompassHeading !== undefined && e.webkitCompassHeading !== null) {
        window.currentDeviceHeading = e.webkitCompassHeading;
      } else if (e.alpha !== null) {
        let h = 360 - e.alpha;
        if (h < 0) h += 360;
        if (h >= 360) h -= 360;
        window.currentDeviceHeading = h;
      }
    }

    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', handleCompassEvent, true);
    }
    window.addEventListener('deviceorientation', handleCompassEvent, true);

    window.getDeviceCompassHeading = function() {
      return window.currentDeviceHeading;
    };

    window.requestDeviceOrientation = async function() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permissionState = await DeviceOrientationEvent.requestPermission();
          return permissionState === 'granted';
        } catch (error) {
          console.error("Error requesting device orientation permission:", error);
          return false;
        }
      }
      return true;
    };

    window.requestWebNotificationPermission = async function() {
      if (!('Notification' in window)) {
        return false;
      }
      try {
        const permission = await Notification.requestPermission();
        return permission === 'granted';
      } catch (e) {
        console.error("Error requesting notification permission:", e);
        return false;
      }
    };

    window.showWebNotification = async function(title, body, icon) {
      if (!('Notification' in window) || Notification.permission !== 'granted') {
        return false;
      }
      const options = {
        body: body || '',
        icon: icon || 'icons/Icon-192.png',
        badge: 'icons/Icon-192.png',
        vibrate: [200, 100, 200],
        tag: 'prayer-reminder',
        renotify: true
      };

      // Try service worker first (REQUIRED on Android Chrome / mobile browsers)
      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.ready;
          if (reg && reg.showNotification) {
            await reg.showNotification(title, options);
            return true;
          }
        } catch (swErr) {
          console.log("ServiceWorker showNotification fallback:", swErr);
        }
      }

      // Fallback to standard constructor (Desktop browsers)
      try {
        new Notification(title, options);
        return true;
      } catch (err) {
        console.error("Failed to show web notification:", err);
        return false;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
